<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project – Ricardo Alva</title>
<meta name="description" content="Project work by Ricardo Alva">
<style>
  @font-face {
    font-family: "Manifont";
    src: url("BBBManifontGrotesk-Book.otf") format("opentype");
    font-display: swap;
  }
  :root {
    color-scheme: light;
    --ink: #080808;
    --muted: #252525;
    --paper: rgba(255, 255, 255, 0.82);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    position: relative;
    isolation: isolate;
    background: #fff;
    color: var(--ink);
    font-family: "Manifont", system-ui, sans-serif;
    font-size: 1rem;
    line-height: 1.5;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background: url("bcgente1.jpg") center / cover no-repeat;
    filter: saturate(40%) brightness(110%);
  }
  a { color: inherit; }
  a:focus-visible { outline: 3px solid #175d45; outline-offset: 4px; }
  .page { width: min(1120px, 100%); margin: 0 auto; padding: 1.5rem clamp(1rem, 4vw, 3rem) 4rem; }
  .back-link { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.4rem 0; font-weight: 700; text-decoration-thickness: 1px; text-underline-offset: 4px; }
  .back-link-bottom { margin-top: 2rem; }
  .project-header { margin: clamp(2rem, 6vh, 4rem) 0 2rem; padding: 0.75rem 0; }
  .project-header h1 { margin: 0; font-size: clamp(2rem, 5vw, 4rem); line-height: 1.05; }
  .media-group { margin-top: 2rem; }
  .media-grid { display: grid; grid-template-columns: 1fr; gap: clamp(1.5rem, 3vw, 2.75rem); }
  .media-item { min-width: 0; margin: 0; }
  .media-item img { display: block; width: 100%; height: auto; }
  @media (max-width: 640px) {
    .project-header { margin-top: 2rem; }
  }
</style>
</head>
<body>
<main class="page">
  <a class="back-link" href="index.html#work"><span aria-hidden="true">←</span> All projects</a>
  <header class="project-header">
    <h1 id="project-title">222 Instalación audiovisual</h1>
  </header>
  <section class="media-group">
    <div id="project-media" class="media-grid"></div>
  </section>
  <a class="back-link back-link-bottom" href="index.html#work"><span aria-hidden="true">←</span> All projects</a>
</main>
<script>
  const projectData = {
    "projection-mapping": {
      title: "222 Instalación audiovisual",
      media: [
        { src: "casita01.gif", label: "Casita 01 projection mapping artwork" },
        { src: "casita02.gif", label: "Casita 02 projection mapping artwork" },
        { src: "casita03.gif", label: "Casita 03 projection mapping artwork" },
        { src: "casita04.gif", label: "Casita 04 projection mapping artwork" }
      ]
    },
    rayo: {
      title: "Rayo",
      media: [
        { src: "mappingluis01.gif", label: "Rayo installation artwork 01" },
        { src: "mappingluis02.gif", label: "Rayo installation artwork 02" },
        { src: "mappingluis03.gif", label: "Rayo installation artwork 03" }
      ]
    },
    blur: {
      title: "Patch de detección de movimiento en touchdesigner",
      media: [
        { src: "movsystem01.gif", label: "Blur movement detection exploration 01" },
        { src: "movsystem02.gif", label: "Blur movement detection exploration 02" },
        { src: "movsystem03.gif", label: "Blur movement detection exploration 03" },
        { src: "movsystem04.gif", label: "Blur movement detection exploration 04" },
        { src: "movsystem05.gif", label: "Blur movement detection exploration 05" }
      ]
    },
    pulsiones: {
      title: "Pulsiones, visuales audioreactivos",
      media: [
        { src: "pulsionesgif01.gif", label: "Pulsiones audiovisual reactive visuals 01" },
        { src: "pulsionesgif02.gif", label: "Pulsiones audiovisual reactive visuals 02" },
        { src: "pulsionesgif03.gif", label: "Pulsiones audiovisual reactive visuals 03" }
      ]
    }
  };

  const selectedProject = new URLSearchParams(window.location.search).get("project");
  const project = projectData[selectedProject] || projectData["projection-mapping"];
  document.title = `${project.title} – Ricardo Alva`;
  document.querySelector("#project-title").textContent = project.title;

  const projectMedia = document.querySelector("#project-media");
  project.media.forEach((item) => {
    const figure = document.createElement("figure");
    figure.className = "media-item";
    const image = document.createElement("img");
    image.src = item.src;
    image.alt = item.label;
    image.loading = "lazy";
    figure.append(image);
    projectMedia.append(figure);
  });
</script>
</body>
</html>
